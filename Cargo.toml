[workspace]
resolver = "2"
members = [
  "crates/sa",
  "crates/sa-client",
  "crates/sa-core",
  "crates/sa-daemon",
  "crates/sa-proto",
  "crates/sa-tui",
]

[workspace.package]
categories = ["command-line-utilities", "development-tools"]
description = "daemon-first coding agent"
edition = "2021"
keywords = ["agent", "daemon", "llm", "tui"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/cawilliamson/stuffies-agent"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
ansi-to-tui = "8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
command-group = { version = "5", features = ["with-tokio"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
dom_query = "0.29"
dom_smoothie = "0.19"
edtui = "0.11"
futures-util = { version = "0.3", features = ["sink", "std"] }
htmd = "0.6"
# ripgrep's walker: what a project's own ignore files exclude is not searched, so a
# coding agent sees the files the developer sees rather than the build output.
ignore = "0.4"
# the language server protocol: framing, handshake, request typing and child supervision.
# what stays ours is the server table, discovery and what a finding means.
lspf = "1.0.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
infer = "0.22"
nix = { version = "0.29", features = ["fs", "process", "signal", "socket", "user"] }
percent-encoding = "2"
ratatui = "0.30"
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rig-core = { version = "=0.46.0", features = ["reqwest"] }
rig-rmcp = "=0.46.0"
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# rmcp speaks reqwest 0.13 while the provider speaks 0.12, so the mcp client names its own.
rmcp-reqwest = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
sa-client = { path = "crates/sa-client", version = "0.1.0" }
sa-core = { path = "crates/sa-core", version = "0.1.0" }
sa-daemon = { path = "crates/sa-daemon", version = "0.1.0" }
sa-proto = { path = "crates/sa-proto", version = "0.1.0" }
sa-tui = { path = "crates/sa-tui", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# the diff an edit reports, so a change is reviewable in place rather than as two blobs.
similar = "3"
termtree = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-markdown = "0.3"
uuid = { version = "1", features = ["v4"] }
# a real chrome fingerprint: boringssl, ja3/ja4 and http2 settings, not a bare client.
wreq = { version = "0.16", default-features = false, features = ["brotli", "charset", "cookies", "deflate", "gzip", "json", "query", "tokio-rt", "webpki-roots", "zstd"] }
wreq-util = { version = "0.2", default-features = false, features = ["emulation", "tokio-rt"] }

[workspace.lints.rust]
# rust_2018_idioms already covers trivial_casts, trivial_numeric_casts,
# unreachable_pub, unused_qualifications and missing_debug_implementations.
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
# documented exceptions. each is a style preference, not a correctness rule.
missing_errors_doc = "allow"     # error enums are named and self-describing
cast_precision_loss = "allow"    # throughput and token figures are display metrics
cast_possible_truncation = "allow" # same: saturating conversions into display types
cast_sign_loss = "allow"         # token and byte counts are never negative
significant_drop_tightening = "allow" # store guards are held for exactly one statement
assigning_clones = "allow"       # clone_from cannot reuse an allocation from &str
too_many_lines = "allow"         # one readable function beats artificial splitting
multiple_crate_versions = "allow" # transitive duplicates we do not control
struct_excessive_bools = "allow"  # a view state machine has independent flags, not a mode
