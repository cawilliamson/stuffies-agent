[package]
name = "sa"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sa"
path = "src/main.rs"

[dependencies]
clap.workspace = true
sa-client.workspace = true
sa-core.workspace = true
sa-daemon.workspace = true
sa-proto.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

# the only crate allowed to write to stdout/stderr: it is the user-facing binary.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
print_stderr = "allow"
print_stdout = "allow"
unwrap_used = "deny"

[dev-dependencies]
tempfile = "3"
