# dependency policy. `cargo deny check` is a mandatory pre-commit gate (spec 15).

[advisories]
version = 2
yanked = "warn"
ignore = [
  # unmaintained, not vulnerable. a build-time proc macro pulled in by ratatui, which has
  # no release that drops it yet. revisit when ratatui moves off it.
  "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
